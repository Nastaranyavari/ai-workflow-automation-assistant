services:
  backend:
    build: .
    container_name: ai_workflow_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  frontend:
    build: .
    container_name: ai_workflow_frontend
    command: streamlit run ui/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - backend

  db:
    image: postgres:16
    container_name: ai_workflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_workflow
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: